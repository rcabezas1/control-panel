<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control Personal</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body class="bg-black text-white min-h-screen p-4 sm:p-8 flex justify-center">

    <main class="w-full max-w-5xl flex flex-col gap-8">
        <header
            class="flex justify-between items-center bg-slate-950 border-2 border-slate-700 rounded-2xl px-6 py-4 shadow-2xl">
            <h1 class="text-2xl font-bold tracking-tight text-white">Panel Personal</h1>
            <button onclick="toggleFullscreen()"
                class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-xl text-lg font-bold transition flex items-center gap-2 cursor-pointer">
                <span>⛶</span> Pantalla Completa
            </button>
        </header>

        <section class="grid grid-cols-1 sm:grid-cols-2 gap-6">
            <div
                class="bg-slate-950 border-4 border-slate-700 rounded-3xl p-8 shadow-2xl flex flex-col justify-between gap-6">
                <div class="flex justify-between items-center">
                    <span class="text-2xl font-black text-slate-300 uppercase tracking-widest flex items-center gap-3">
                        <span>🇪🇸</span> MADRID
                    </span>
                    <span class="text-6xl">🏙️</span>
                </div>
                <div id="clock-madrid" class="text-7xl font-black font-mono text-white tracking-tighter">--:--</div>
                <div class="border-t-4 border-slate-800 pt-6 flex items-center justify-between">
                    <span class="text-xl font-bold text-slate-400 uppercase">Clima</span>
                    <div id="weather-madrid" class="text-5xl font-black font-mono text-white">--°C</div>
                </div>
            </div>

            <div
                class="bg-slate-950 border-4 border-slate-700 rounded-3xl p-8 shadow-2xl flex flex-col justify-between gap-6">
                <div class="flex justify-between items-center">
                    <span class="text-2xl font-black text-slate-300 uppercase tracking-widest flex items-center gap-3">
                        <span>🇨🇴</span> BOGOTÁ
                    </span>
                    <span class="text-6xl">🏔️</span>
                </div>
                <div id="clock-bogota" class="text-7xl font-black font-mono text-white tracking-tighter">--:--</div>
                <div class="border-t-4 border-slate-800 pt-6 flex items-center justify-between">
                    <span class="text-xl font-bold text-slate-400 uppercase">Clima</span>
                    <div id="weather-bogota" class="text-5xl font-black font-mono text-white">--°C</div>
                </div>
            </div>
        </section>

        <div id="login-container" class="flex justify-center my-4">
            <button onclick="handleAuthClick()"
                class="bg-blue-700 hover:bg-blue-800 text-white font-black text-xl py-4 px-8 rounded-2xl transition cursor-pointer shadow-xl">
                Conectar mi Google Calendar
            </button>
        </div>

        <section id="calendar-section"
            class="bg-slate-950 border-2 border-slate-700 rounded-3xl p-8 shadow-2xl flex flex-col gap-6 hidden">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                <h2 class="text-xl font-bold text-slate-300 uppercase tracking-widest">Próximos Eventos</h2>
                <div class="flex items-center gap-4 w-full sm:w-auto">
                    <select id="calendar-select" onchange="onCalendarChange()"
                        class="w-full sm:w-80 bg-black border-2 border-slate-700 text-white text-lg font-bold rounded-xl px-4 py-3 focus:outline-none focus:border-blue-600 cursor-pointer">
                        <option value="">Cargando...</option>
                    </select>
                    <button onclick="refreshCurrentCalendar()" title="Refrescar eventos"
                        class="bg-slate-800 hover:bg-slate-700 text-white p-4 rounded-xl transition cursor-pointer text-xl">
                        🔄
                    </button>
                </div>
            </div>
            <div id="events-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                <p class="text-lg text-slate-500 col-span-full">Selecciona un calendario.</p>
            </div>
        </section>
    </main>
    <script src="app.js"></script>
</body>

</html>
